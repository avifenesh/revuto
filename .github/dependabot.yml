version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-and-types:
        patterns: ["@types/*", "typescript", "tsx"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action steps must move together: a mixed init/analyze version
      # fails the analyze job ("must use the same version").
      codeql-action:
        patterns: ["github/codeql-action"]
